<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運轉盤</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Winner Display Banner -->
    <div id="winner-banner" class="winner-banner hidden">
        <div id="winner-text" class="winner-text"></div>
    </div>

    <!-- Current Name Display (during spin) -->
    <div id="current-name-display" class="current-name-display hidden">
        <span id="current-name"></span>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Input Panel -->
        <div id="input-panel" class="input-panel">
            <h1 class="title">幸運轉盤</h1>
            <p class="subtitle">上傳或輸入學生名單來開始</p>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" data-tab="upload">上傳檔案</button>
                <button class="tab" data-tab="manual">手動輸入</button>
            </div>

            <!-- Upload Tab -->
            <div id="tab-upload" class="tab-content active">
                <div id="drop-zone" class="drop-zone">
                    <div class="drop-zone-icon">&#128196;</div>
                    <p>拖放 .csv 或 .xls/.xlsx 檔案到這裡</p>
                    <p class="drop-zone-hint">或點擊選擇檔案</p>
                    <input type="file" id="file-input" accept=".csv,.xls,.xlsx" hidden>
                </div>
                <div id="file-info" class="file-info hidden">
                    <span id="file-name"></span>
                    <button id="clear-file" class="btn-small">清除</button>
                </div>
                <div class="format-hint">
                    <p>欄位格式：<strong>姓名</strong>、<strong>號碼</strong></p>
                </div>
            </div>

            <!-- Manual Input Tab -->
            <div id="tab-manual" class="tab-content">
                <div class="manual-form">
                    <div class="form-row">
                        <input type="text" id="input-name" placeholder="姓名" class="form-input">
                        <input type="text" id="input-id" placeholder="號碼" class="form-input form-input-small">
                    </div>
                    <div class="form-row">
                        <button id="btn-add" class="btn-add">+ 新增</button>
                        <button id="btn-cancel-edit" class="btn-cancel-edit hidden">取消</button>
                    </div>
                </div>
            </div>

            <!-- Student List -->
            <div id="student-list-container" class="student-list-container hidden">
                <div class="student-list-header">
                    <h3>名單 (<span id="student-count">0</span>)</h3>
                    <button id="btn-clear-all" class="btn-clear-all" title="清除全部">全部清除</button>
                </div>
                <div id="student-list" class="student-list"></div>
            </div>

            <!-- Order Toggle -->
            <div id="order-toggle" class="order-toggle hidden">
                <button class="order-option active" data-order="shuffle">&#127922; 隨機排列</button>
                <button class="order-option" data-order="original">&#128203; 原始順序</button>
            </div>

            <!-- Load Button -->
            <button id="btn-load" class="btn-load hidden">
                開始轉盤
            </button>
        </div>

        <!-- Wheel Container -->
        <div id="wheel-container" class="wheel-container hidden">
            <div class="wheel-stage">
                <!-- Wheel Frame -->
                <div class="wheel-frame">
                    <!-- Indicator Arrow -->
                    <div class="indicator-arrow"></div>

                    <!-- Canvas -->
                    <canvas id="wheel-canvas"></canvas>

                    <!-- Center Spin Button -->
                    <button id="btn-spin" class="btn-spin">
                        <span class="spin-text">SPIN</span>
                    </button>
                </div>

                <!-- Right Sidebar: controls + history -->
                <div class="wheel-sidebar">
                    <button id="btn-back" class="btn-back">&#8592; 編輯名單</button>
                    <div class="mode-toggle">
                        <button id="btn-mode" class="btn-mode" title="切換選取模式">
                            <span id="mode-label">隨機</span>
                        </button>
                        <button id="btn-clear-memory" class="btn-clear-memory hidden" title="清除選取記錄">重置</button>
                    </div>
                    <div id="history-panel" class="history-panel">
                        <h3 class="history-title">歷史紀錄</h3>
                        <div id="history-list" class="history-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Full-window color projection canvas -->
    <canvas id="glow-canvas" class="glow-canvas"></canvas>

    <!-- Confetti Canvas (overlay) -->
    <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

    <!-- Admin Panel (Secret) -->
    <div id="admin-overlay" class="admin-overlay hidden">
        <div class="admin-panel">
            <h2 class="admin-title">管理員模式</h2>
            <div class="admin-section">
                <label class="admin-label">超級幸運星 <span class="admin-hint">（前6輪保證抽中）</span></label>
                <textarea id="admin-whitelist" class="admin-textarea" placeholder="每行輸入一個姓名" rows="6"></textarea>
            </div>
            <div class="admin-section">
                <label class="admin-label">已經中標者 <span class="admin-hint">（永遠不會被抽中）</span></label>
                <textarea id="admin-blacklist" class="admin-textarea" placeholder="每行輸入一個姓名" rows="6"></textarea>
            </div>
            <div class="admin-actions">
                <button id="admin-save" class="btn-admin-save">儲存</button>
                <button id="admin-close" class="btn-admin-close">關閉</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="js/sound.js?v=4"></script>
    <script src="js/effects.js?v=4"></script>
    <script src="js/wheel.js?v=4"></script>
    <script src="js/app.js?v=4"></script>
</body>
</html>
